name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest yfinance requests python-dotenv

      - name: Check TODO folder and status consistency
        run: python scripts/check_todo_status.py

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Check exact baseline failure inventory
        if: always()
        run: python scripts/check_release_baseline.py test-results.xml

      - name: Check CC V3 behavioral contract
        run: python scripts/check_cc_contract.py

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-test-results
          path: test-results.xml
