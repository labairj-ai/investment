name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: pip install pytest yfinance requests python-dotenv
      - name: Exact-head Scout source influence audit
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p validation-results
          # checkout's temporary credential/worktree Git settings are not a
          # production boundary and must not be whitelisted by the auditor.
          AUDIT_ROOT="$RUNNER_TEMP/scout-influence-source-$CANDIDATE_SHA"
          git clone --no-hardlinks --no-checkout "$PWD" "$AUDIT_ROOT"
          git -C "$AUDIT_ROOT" checkout --detach "$CANDIDATE_SHA"
          python -I -S "$AUDIT_ROOT/ops/discovery/influence.py" --root "$AUDIT_ROOT" --head "$CANDIDATE_SHA" > validation-results/source-influence.json
      - name: Aggregate independent repository diagnostics
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRIOR_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/aggregate_release_validation.py --out validation-results --head "$CANDIDATE_SHA" --prior "$PRIOR_SHA"
      - name: Human-readable exact-head summary
        if: always()
        run: |
          if test -f validation-results/validation-summary.md; then
            cat validation-results/validation-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FAIL: mandatory aggregate summary missing' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-head-repository-validation
          path: |
            validation-results/source-influence.json
            validation-results/test-results.xml
            validation-results/validation-summary.json
            validation-results/validation-summary.md
            validation-results/*.log
          if-no-files-found: error
