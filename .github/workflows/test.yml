name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # These operator-managed variables are independent of candidate source.
      # Provision the already-reviewed digest before any candidate execution.
      - name: Provision approved immutable validation runtime
        env:
          VALIDATOR_IMAGE: ${{ vars.DEV_AGENT_VALIDATOR_IMAGE }}
          ORCHESTRATOR_SHA: ${{ vars.DEV_AGENT_ORCHESTRATOR_SHA }}
        run: |
          python3 -I - <<'PY'
          import os,re,subprocess
          image=os.environ['VALIDATOR_IMAGE'];sha=os.environ['ORCHESTRATOR_SHA']
          if not re.fullmatch(r'ghcr.io/labairj-ai/investment-validator@sha256:[a-f0-9]{64}',image):
              raise SystemExit('UNAVAILABLE: approved validator image digest not provisioned')
          if not re.fullmatch(r'[a-f0-9]{40}',sha):
              raise SystemExit('UNAVAILABLE: reviewed orchestration SHA not configured')
          subprocess.run(['docker','pull',image],check=True)
          PY
      - name: Checkout reviewed trusted orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed official v4 ref
        with:
          ref: ${{ vars.DEV_AGENT_ORCHESTRATOR_SHA }}
          path: trusted
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact candidate head as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Run mandatory regression and release gates in isolation
        env:
          VALIDATOR_IMAGE: ${{ vars.DEV_AGENT_VALIDATOR_IMAGE }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          APPROVED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -I "$GITHUB_WORKSPACE/trusted/scripts/run_contained_ci.py" \
            --root "$GITHUB_WORKSPACE/candidate" --head "$CANDIDATE_HEAD" \
            --base "$APPROVED_BASE" --image "$VALIDATOR_IMAGE" \
            --output "$RUNNER_TEMP/approved-validation-artifacts"
      - name: Preserve approved evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed official v4 ref
        with:
          name: investment-test-results
          path: |
            ${{ runner.temp }}/approved-validation-artifacts/test-results.xml
            ${{ runner.temp }}/approved-validation-artifacts/validation.json
            ${{ runner.temp }}/approved-validation-artifacts/supplemental.json
          if-no-files-found: error
